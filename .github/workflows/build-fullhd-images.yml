name: Build Full HD project images

on:
  push:
    paths:
      - 'assets/fullhd/**'
      - '.github/workflows/build-fullhd-images.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild completed full-resolution project images
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          build_one() {
            name="$1"
            last="$2"
            if [ -f "assets/fullhd/${name}.${last}.txt" ]; then
              cat assets/fullhd/${name}.*.txt | tr -d '\r\n ' | base64 -d > "assets/projects/${name}.webp"
              NAME="$name" python3 - <<'PY'
          import os
          from pathlib import Path
          name = os.environ['NAME']
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(f'assets/projects/{name}.svg', f'assets/projects/{name}.webp')
          p.write_text(s, encoding='utf-8')
          PY
              changed=1
            fi
          }
          build_one pace 03
          build_one masksource 03
          build_one bonevibauth 04
          build_one voice-defense 02
          build_one arc-solver 05
          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html assets/projects/*.webp
            if ! git diff --cached --quiet; then
              git commit -m "Build full-resolution project images"
              git push
            fi
          fi
